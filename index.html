<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#78927d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Food is everything.">
<title>Food is everything.</title>
<style>
:root{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;color:#344c3b;background:#f9f7ef}*{box-sizing:border-box}body{margin:0}main{max-width:650px;margin:auto;padding:28px 18px 70px}.eyebrow{letter-spacing:.22em;font-size:11px;color:#998255;font-weight:700}h1{font-family:Georgia,serif;font-size:clamp(36px,8vw,58px);line-height:1.02;margin:14px 0 8px;color:#355b43}.subtitle{margin:0;color:#a38956;font-size:15px;letter-spacing:.06em}.prompt{font-size:17px;margin:22px 0}.card{background:#fffdf8;border:1px solid #e9e5d8;border-radius:24px;box-shadow:0 12px 35px #56684913;padding:22px;margin:18px 0}.section{font-size:13px;letter-spacing:.1em;color:#8b906c;font-weight:800;margin:0 0 14px}.areas{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid #bdcbbb;background:#f6f8f3;border-radius:99px;padding:10px 14px;color:#526b55;cursor:pointer}.chip.active{background:#718e75;color:white;border-color:#718e75}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0}.row label{font-size:14px}select,input,button{font:inherit}select,input[type=text]{border:1px solid #d6ddcf;border-radius:11px;background:white;padding:9px;color:#344c3b}input[type=checkbox]{accent-color:#718e75;transform:scale(1.2)}.machine{text-align:center;background:linear-gradient(150deg,#eaf0e5,#fffdf7)}.reel{min-height:105px;display:grid;place-content:center;border:2px solid #d8c59c;border-radius:17px;background:#fffdf7;margin:20px 0;color:#355b43;font-family:Georgia,serif;font-size:27px}.reel small{display:block;font:13px system-ui;color:#a38956;margin-top:6px}.result-label{font-size:12px;letter-spacing:.2em;color:#9a7c43;font-weight:800}.primary{width:100%;border:0;border-radius:14px;padding:16px;background:#769178;color:#fff;font-weight:800;cursor:pointer;box-shadow:0 5px 0 #58705b}.primary:disabled{opacity:.5;cursor:not-allowed}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.actions button,.smallbtn{border:1px solid #cbd5c7;background:white;color:#49664d;padding:10px 13px;border-radius:11px;cursor:pointer}.muted{color:#7d897b;font-size:13px}.list{list-style:none;padding:0;margin:0}.list li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 0;border-bottom:1px solid #ecece4}.list li:last-child{border:0}.list small{display:block;color:#899485}.list .name{min-width:0;overflow-wrap:anywhere}.list .buttons{display:flex;gap:5px;flex-shrink:0}.list .buttons button{border:0;background:#eef2e9;border-radius:8px;padding:7px;cursor:pointer}.form{display:grid;grid-template-columns:1fr 1fr auto;gap:7px}.form input{min-width:0}.footer{text-align:center;color:#9b9d8e;font-size:12px;margin-top:32px}#message{min-height:20px}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #d0ab59;outline-offset:2px}@media(max-width:460px){.form{grid-template-columns:1fr 1fr}.form button{grid-column:1/-1}}
</style>
</head>
<body><main>
<div class="eyebrow">GOOD FOOD, GOOD MOOD ✦</div><h1>Food is<br>everything.</h1><p class="prompt">今天吃点什么好呢？</p>
<section class="card"><h2 class="section">01 / 选择觅食区域 · 可多选</h2><div class="areas" id="areas"></div><div class="row"><label for="favoritesOnly">只抽我的收藏</label><input id="favoritesOnly" type="checkbox"></div><div class="row"><label for="avoidDays">连续不重复天数</label><select id="avoidDays"><option>1</option><option>3</option><option>5</option><option>7</option><option>14</option></select></div><p class="muted" id="poolCount"></p></section>
<section class="card machine"><div class="result-label">LUCKY FOOD MACHINE</div><div class="reel" id="reel" aria-live="polite">Ready to spin?<small>选好区域后，开始你的美食冒险</small></div><button class="primary" id="spin">Spin for Food!</button><p id="message" class="muted" role="status"></p><div id="resultActions" class="actions" hidden><button id="favoriteResult">♡ 收藏这家</button><button id="eatResult">就吃这家！</button></div></section>
<section class="card"><h2 class="section">我的收藏 <span id="favoriteCount">0</span> 家</h2><ul class="list" id="favoriteList"></ul></section>
<section class="card"><h2 class="section">用餐记录 <span id="historyCount">0</span> 次</h2><ul class="list" id="historyList"></ul></section>
<section class="card"><h2 class="section">自定义餐厅库</h2><form class="form" id="addForm"><input id="newName" type="text" maxlength="60" placeholder="餐厅名称" required><select id="newArea"></select><button class="smallbtn">添加餐厅</button></form><ul class="list" id="restaurantList"></ul></section>
<section class="card"><h2 class="section">数据备份</h2><div class="actions"><button class="smallbtn" id="exportBtn">导出数据</button><button class="smallbtn" id="importBtn">导入数据</button><input type="file" id="importFile" accept="application/json,.json" hidden></div><p class="muted">数据保存在当前浏览器。换设备时可用导出和导入迁移。</p></section>
<div class="footer">MADE FOR HAPPY FOOD MOMENTS ♡</div>
</main><script>
'use strict';
const AREAS=['凌空SOHO','上海荟聚','长宁大融城'];
const DEFAULTS=[['和府捞面','凌空SOHO'],['小杨生煎','凌空SOHO'],['老乡鸡','凌空SOHO'],['麦当劳','凌空SOHO'],['肯德基','凌空SOHO'],['吉祥馄饨','凌空SOHO'],['赛百味','凌空SOHO'],['兰州牛肉面','凌空SOHO'],['西贝莜面村','上海荟聚'],['外婆家','上海荟聚'],['太二酸菜鱼','上海荟聚'],['海底捞','上海荟聚'],['寿司郎','上海荟聚'],['绿茶餐厅','上海荟聚'],['喜家德','上海荟聚'],['一风堂','上海荟聚'],['捞王','长宁大融城'],['牛角烧肉','长宁大融城'],['必胜客','长宁大融城'],['星巴克','长宁大融城'],['大米先生','长宁大融城'],['达美乐','长宁大融城'],['味千拉面','长宁大融城']].map((x,i)=>({id:'default-'+i,name:x[0],area:x[1]}));
const KEY='food-is-everything-v1';
function fresh(){return {restaurants:DEFAULTS.map(x=>({...x})),favorites:[],history:[],areas:[...AREAS],favoritesOnly:false,avoidDays:3}}
function valid(s){return s&&Array.isArray(s.restaurants)&&Array.isArray(s.favorites)&&Array.isArray(s.history)&&Array.isArray(s.areas)&&s.restaurants.every(r=>r&&typeof r.id==='string'&&typeof r.name==='string'&&AREAS.includes(r.area))}
let state;try{let v=JSON.parse(localStorage.getItem(KEY));state=valid(v)?v:fresh()}catch{state=fresh()}
let picked=null,timer=null;const $=id=>document.getElementById(id);const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{$('message').textContent='浏览器无法保存数据，请用导出功能备份。'}};
function node(tag,txt){let e=document.createElement(tag);e.textContent=txt;return e}
function eligible(){let cutoff=Date.now()-Number(state.avoidDays)*86400000;let recent=new Set(state.history.filter(h=>Date.parse(h.date)>=cutoff).map(h=>h.id));return state.restaurants.filter(r=>state.areas.includes(r.area)&&(!state.favoritesOnly||state.favorites.includes(r.id))&&!recent.has(r.id))}
function refresh(){let a=$('areas');a.replaceChildren();AREAS.forEach(area=>{let b=node('button',area);b.type='button';b.className='chip'+(state.areas.includes(area)?' active':'');b.setAttribute('aria-pressed',state.areas.includes(area));b.onclick=()=>{state.areas=state.areas.includes(area)?state.areas.filter(x=>x!==area):[...state.areas,area];save();refresh()};a.append(b)});$('favoritesOnly').checked=state.favoritesOnly;$('avoidDays').value=String(state.avoidDays);$('poolCount').textContent=eligible().length+' 家餐厅可参与抽选';$('favoriteCount').textContent=state.favorites.length;$('historyCount').textContent=state.history.length;renderList('favoriteList',state.restaurants.filter(r=>state.favorites.includes(r.id)),r=>{let b=node('button','移除收藏');b.onclick=()=>{state.favorites=state.favorites.filter(id=>id!==r.id);save();refresh()};return[b]});renderList('historyList',state.history.slice().reverse(),h=>{let b=node('button','删除');b.onclick=()=>{state.history=state.history.filter(x=>x!==h);save();refresh()};return[b]},h=>({name:state.restaurants.find(r=>r.id===h.id)?.name||h.name||'已删除餐厅',detail:new Date(h.date).toLocaleDateString('zh-CN')}));renderList('restaurantList',state.restaurants,r=>{let edit=node('button','编辑'),del=node('button','删除');edit.onclick=()=>{let name=prompt('修改餐厅名称',r.name);if(name===null)return;name=name.trim();if(!name)return alert('名称不能为空');r.name=name;save();refresh()};del.onclick=()=>{if(!confirm('删除 '+r.name+'？'))return;state.restaurants=state.restaurants.filter(x=>x.id!==r.id);state.favorites=state.favorites.filter(id=>id!==r.id);save();refresh()};return[edit,del]});$('favoriteResult').textContent=picked&&state.favorites.includes(picked.id)?'♥ 已收藏':'♡ 收藏这家'}
function renderList(id,items,buttons,format){let ul=$(id);ul.replaceChildren();if(!items.length){let li=node('li','暂无记录');li.className='muted';ul.append(li);return}items.forEach(item=>{let d=format?format(item):{name:item.name,detail:item.area};let li=node('li',''),span=node('span',d.name),small=node('small',d.detail),box=node('span','');span.className='name';box.className='buttons';span.append(small);buttons(item).forEach(b=>box.append(b));li.append(span,box);ul.append(li)})}
$('favoritesOnly').onchange=e=>{state.favoritesOnly=e.target.checked;save();refresh()};$('avoidDays').onchange=e=>{state.avoidDays=Number(e.target.value);save();refresh()};$('newArea').replaceChildren(...AREAS.map(x=>{let o=node('option',x);o.value=x;return o}));$('addForm').onsubmit=e=>{e.preventDefault();let name=$('newName').value.trim();if(!name)return;state.restaurants.push({id:'custom-'+Date.now()+'-'+Math.random().toString(36).slice(2),name,area:$('newArea').value});$('newName').value='';save();refresh()};$('spin').onclick=()=>{let pool=eligible();if(!pool.length){$('message').textContent='当前没有可抽选餐厅，请调整区域、收藏或不重复天数。';return}picked=pool[Math.floor(Math.random()*pool.length)];$('spin').disabled=true;$('resultActions').hidden=true;$('message').textContent='正在抽选…';let n=0;clearInterval(timer);timer=setInterval(()=>{let r=pool[Math.floor(Math.random()*pool.length)];$('reel').replaceChildren(node('span',r.name),node('small',r.area));if(++n>=15){clearInterval(timer);$('reel').replaceChildren(node('span',picked.name),node('small',picked.area));$('message').textContent="Today's Pick ✨";$('resultActions').hidden=false;$('spin').disabled=false;refresh()}},80)};$('favoriteResult').onclick=()=>{if(!picked)return;state.favorites=state.favorites.includes(picked.id)?state.favorites.filter(id=>id!==picked.id):[...state.favorites,picked.id];save();refresh()};$('eatResult').onclick=()=>{if(!picked)return;let today=new Date().toLocaleDateString('en-CA');if(state.history.some(h=>h.id===picked.id&&new Date(h.date).toLocaleDateString('en-CA')===today)){ $('message').textContent='今天已经记录过这家啦';return}state.history.push({id:picked.id,name:picked.name,date:new Date().toISOString()});$('message').textContent='已加入用餐记录，祝你用餐愉快！';save();refresh()};$('exportBtn').onclick=()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='food-is-everything-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(!valid(data))throw Error();if(!confirm('导入会覆盖当前餐厅、收藏和记录。继续吗？'))return;state=data;save();refresh();$('message').textContent='导入成功'}catch{alert('备份文件格式不正确')}e.target.value=''};refresh();
</script></body></html>
